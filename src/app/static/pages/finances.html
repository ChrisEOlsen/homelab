<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finances · Homelab</title>
  <script src="/static/js/lib/theme-init.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-canvas text-ink min-h-screen flex flex-col font-sans antialiased">

  <!-- pb-24 + the safe-area inset (see input.css) keep the tail of the last
       panel and the footer clear of a mobile browser's bottom toolbar, which
       overlays the viewport without shortening the scrollable document — so
       the final ~80px would otherwise sit permanently under it at max scroll.
       This is the tallest page in the app by a wide margin, which is why it
       shows up here first. -->
  <main class="page-bottom-gap flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 py-8 pb-24 space-y-6">

    <div class="flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-xl font-semibold tracking-tight text-ink page-title">Finances</h1>
      <div class="flex items-center gap-2">
        <button id="month-prev" type="button" aria-label="Previous month"
                class="px-2 py-1.5 text-sm border border-hairline text-ink-dim hover:text-ink hover:bg-surface-raised transition-colors">&lsaquo;</button>
        <span id="month-label" class="text-sm text-ink tabular-nums min-w-32 text-center">&hellip;</span>
        <button id="month-next" type="button" aria-label="Next month"
                class="px-2 py-1.5 text-sm border border-hairline text-ink-dim hover:text-ink hover:bg-surface-raised transition-colors">&rsaquo;</button>
      </div>
    </div>

    <section id="ledger" class="grid grid-cols-2 md:grid-cols-5 gap-px bg-hairline border border-hairline" aria-label="Month ledger"></section>

    <div class="flex flex-wrap items-center justify-between gap-3">
      <p id="sync-status" class="text-xs text-ink-dim">Never synced.</p>
      <button id="sync-btn" type="button"
              class="px-3 py-1.5 text-xs border border-hairline text-ink-dim hover:text-ink hover:bg-surface-raised transition-colors">Sync now</button>
    </div>

    <section id="chart-panel" class="border border-hairline bg-surface p-5 space-y-3" aria-label="Cash flow chart"></section>

    <section id="sessions-panel" class="border border-hairline bg-surface p-5 space-y-3" aria-label="Sessions"></section>
    <section id="shopping-panel" class="border border-hairline bg-surface p-5 space-y-3" aria-label="Shopping list"></section>
    <section id="subscriptions-panel" class="border border-hairline bg-surface p-5 space-y-3" aria-label="Subscriptions"></section>
    <section id="clients-panel" class="border border-hairline bg-surface p-5 space-y-3" aria-label="Clients"></section>
    <section id="rates-panel" class="border border-hairline bg-surface p-5 space-y-3" aria-label="Duration rates"></section>
    <section id="all-time" class="border border-hairline bg-surface px-5 py-4 text-xs text-ink-dim tabular-nums" aria-label="All-time totals"></section>

  </main>

  <footer class="border-t border-hairline px-4 sm:px-6 py-4 text-xs text-ink-dim">
    Homelab
  </footer>

  <script type="module" src="/static/js/lib/nav.js"></script>
  <script type="module" src="/static/js/lib/theme.js"></script>
  <script type="module" src="/static/js/finances.js"></script>
</body>
</html>
